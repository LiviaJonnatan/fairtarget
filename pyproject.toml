[project]
name = "fairtarget"
version = "0.1.0"
description = "Budget-constrained intervention targeting with fairness floors, from treatment-effect estimates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.11", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fairtarget"]
